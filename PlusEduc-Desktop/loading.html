<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PlusEduc</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A2463; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; overflow: hidden;
         background: radial-gradient(60% 50% at 50% 42%, rgba(79,195,247,.25), transparent 70%), #0A2463; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 20px 60px -15px rgba(79,195,247,.55); animation: pop .6s cubic-bezier(.16,1,.3,1); }
  h1 { margin: 22px 0 4px; font-size: 34px; letter-spacing: -.5px; }
  p { margin: 0; color: #4FC3F7; font-size: 14px; }
  #status { margin-top: 28px; color: rgba(255,255,255,.75); font-size: 13px; min-height: 18px; }
  .bar { margin-top: 12px; width: 180px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #4FC3F7, #fff); animation: slide 1.1s ease-in-out infinite; }
  #erro { display: none; max-width: 520px; text-align: center; margin-top: 18px; color: #ffd2d2; font-size: 14px; line-height: 1.5; white-space: pre-line; }
  @keyframes pop { from { transform: scale(.7); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes slide { from { transform: translateX(-100%) } to { transform: translateX(260%) } }
  @media (prefers-reduced-motion: reduce) { img, .bar span { animation: none } }
</style>
</head>
<body>
  <img src="build/icon.png" alt="">
  <h1>PlusEduc</h1>
  <p>Soluções Inteligentes para a Educação</p>
  <div id="status">Iniciando…</div>
  <div class="bar" id="bar"><span></span></div>
  <div id="erro"></div>
</body>
</html>
